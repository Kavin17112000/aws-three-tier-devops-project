
name: Build, Push, and Deploy Bookstore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/bookstore-frontend:$IMAGE_TAG" ./frontend
          docker push "$REGISTRY/bookstore-frontend:$IMAGE_TAG"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/bookstore-backend:$IMAGE_TAG" ./backend
          docker push "$REGISTRY/bookstore-backend:$IMAGE_TAG"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          test -n "$EC2_HOST" || { echo "EC2_HOST secret is missing"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY secret is missing"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bookstore.pem
          chmod 600 ~/.ssh/bookstore.pem
          ssh-keygen -y -f ~/.ssh/bookstore.pem > /dev/null
          ssh-keyscan -T 30 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate EC2 to ECR
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REGISTRY: 044957643091.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            ssh -i ~/.ssh/bookstore.pem "$EC2_USER@$EC2_HOST" \
              "docker login --username AWS --password-stdin $REGISTRY"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/bookstore.pem "$EC2_USER@$EC2_HOST" \
            "set -e
             cd ~/bookstore
             git pull origin main
             if grep -q '^IMAGE_TAG=' .env; then
               sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env
             else
               echo 'IMAGE_TAG=$IMAGE_TAG' >> .env
             fi
             docker compose -f compose.yaml pull frontend backend
             docker compose -f compose.yaml up -d --force-recreate frontend backend
             docker compose -f compose.yaml ps"

