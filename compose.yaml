
services:
  db:
    image: postgres:16
    container_name: bookstore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - bookstore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: 044957643091.dkr.ecr.ap-south-1.amazonaws.com/bookstore-backend:631e33f5553c34042dea7c35d14f71328887e5ae
    container_name: bookstore-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: 044957643091.dkr.ecr.ap-south-1.amazonaws.com/bookstore-frontend:631e33f5553c34042dea7c35d14f71328887e5ae
    container_name: bookstore-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  bookstore-data:
    external: true
